[build-system]
requires = [
    "setuptools>=80",
    "setuptools-scm>=8"
]
build-backend = "setuptools.build_meta"


[project]
name = "tastro"
dynamic = [
    "version"
]
description = ""
authors = [
    { name = "Alfonso Sánchez Rodríguez", email = "a.sanchezrodriguez@student.tudelft.nl" }
]
requires-python = ">=3.11"
dependencies = [
]

[project.optional-dependencies]
dev = [
    "pytest",
    "sphinx",
    "numpydoc",
    "sphinx_design",
    "pydata-sphinx-theme",
    "sphinx-favicon",
    "sphinx-autoapi",
    "sphinx-design"
]

[tool.setuptools.packages.find]
where = [
    "src"
]

[tool.setuptools_scm]
version_file = "src/tastro/_version.py"

[tool.setuptools_scm.scm.git]
pre_parse = "fail_on_missing_submodules"
describe_command = "git describe --dirty --tags --long --exclude *js*"

[tool.mypy]
mypy_path = "src"
check_untyped_defs = false
disallow_any_generics = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
no_implicit_reexport = true

[project.scripts]
compare_propagations = "tastro.legacy.propagation.cli:compare_propagation_results_cli"
# drsw_ephemerides = "tastro.legacy.propagation.cli:propagation_residual_wrt_ephemerides_rsw_cli"
# dj2000_ephemerides = "tastro.legacy.propagation.cli:propagation_residual_wrt_ephemerides_j2000_cli"
tsimulator = "tastro.legacy.runner.cli:runner_cli"
# tprefit = "tastro.legacy.runner.cli:calculate_prefit_residuals_cli"
# doppler_prefits = "tastro.legacy.estimation.cli:show_doppler_prefit_residuals_cli"
cartesian_residuals = "tastro.legacy.estimation.cli:show_cartesian_residuals_cli"
# doppler_residuals = "tastro.legacy.estimation.cli:show_doppler_residuals_cli"
fixed_integrator_analysis = "tastro.legacy.misc.cli:compare_fixed_step_integrators_cli"
estimation_summary = "tastro.legacy.estimation.cli:show_estimation_summary_cli"
doppler_estimation_results = "tastro.legacy.estimation.cli:show_doppler_estimation_results_cli"
# dest_rsw_ephemerides = "tastro.legacy.estimation.cli:estimated_orbit_vs_ephemerides_rsw_cli"
# dest_j2000_ephemerides = "tastro.legacy.estimation.cli:estimated_orbit_vs_ephemerides_j2000_cli"

# Unified command line interface: `tastro <group> <command>`
tastro = "tastro.cli.main:main"
